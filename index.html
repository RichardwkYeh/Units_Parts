<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物品借用管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto min-h-screen pb-12">

  <h1 class="text-xl font-bold text-center mb-4 text-blue-600">📦 物品借用管理系統</h1>

  <!-- 導覽頁籤 -->
  <div class="flex border mb-4 bg-white rounded-lg overflow-hidden shadow-sm text-sm">
    <button onclick="switchTab('list')" id="btn-list" class="w-1/3 py-2 text-center font-bold bg-blue-500 text-white">物品清單</button>
    <button onclick="switchTab('add')" id="btn-add" class="w-1/3 py-2 text-center font-bold bg-gray-100 text-gray-700">拍照新增</button>
    <button onclick="switchTab('scan')" id="btn-scan" class="w-1/3 py-2 text-center font-bold bg-gray-100 text-gray-700">掃碼借還</button>
  </div>

  <!-- 1. 清單頁 -->
  <div id="tab-list" class="space-y-3">
    <button onclick="loadItems()" class="w-full bg-gray-200 text-gray-700 py-1 rounded text-xs">🔄 重新整理</button>
    <div id="items-list" class="space-y-3">載入中...</div>
  </div>

  <!-- 2. 新增物品頁 -->
  <div id="tab-add" class="hidden bg-white p-4 rounded-lg shadow space-y-4">
    <h2 class="text-base font-bold text-gray-800">新增物品建檔</h2>
    <div>
      <label class="block text-xs text-gray-500 mb-1">1. 拍攝照片：</label>
      <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(event)" class="w-full text-sm">
      <img id="photo-preview" class="w-full h-40 object-cover mt-2 hidden rounded border">
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">2. 物品名稱：</label>
      <input type="text" id="item-name" class="w-full border rounded p-2 text-sm" placeholder="例如：投影機、延長線">
    </div>
    <button onclick="saveItem()" class="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold shadow">建檔並生成 QR Code</button>
  </div>

  <!-- 3. 掃碼借還頁 -->
  <div id="tab-scan" class="hidden bg-white p-4 rounded-lg shadow space-y-4">
    <h2 class="text-base font-bold text-gray-800">掃描物品 QR Code</h2>
    <div id="reader" class="w-full overflow-hidden rounded"></div>
    
    <div id="scan-result" class="hidden space-y-3 p-3 bg-blue-50 rounded border border-blue-200">
      <p class="text-sm font-bold text-blue-900">物品 ID：<span id="target-id"></span></p>
      <input type="text" id="borrower-input" class="w-full border rounded p-2 text-sm" placeholder="請輸入借用者姓名">
      <div class="flex gap-2">
        <button onclick="doBorrow()" class="w-1/2 bg-green-600 text-white py-2 rounded text-sm font-bold">登記借出</button>
        <button onclick="doReturn()" class="w-1/2 bg-orange-500 text-white py-2 rounded text-sm font-bold">辦理歸還</button>
      </div>
    </div>
  </div>

  <!-- QR Code 彈窗 -->
  <div id="qr-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg text-center space-y-4 max-w-xs w-full shadow-xl">
      <h3 id="modal-title" class="font-bold text-gray-800"></h3>
      <div id="qrcode" class="flex justify-center p-2 bg-white"></div>
      <p class="text-xs text-gray-400">可截圖列印並貼在物品上</p>
      <button onclick="closeModal()" class="bg-gray-600 text-white px-4 py-1.5 rounded text-sm w-full">關閉</button>
    </div>
  </div>

  <script>
    // ⚠️ 貼上你在 Step 2 複製到的 API URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxAe-1VRyJ0Rtm2kGTx-HogJ_-2pfpEd8tnauTEz3QT3T3t52x3-aCZxIG_u-l14uBl/exec";
    
    let currentPhoto = '';
    let html5QrcodeScanner = null;

    function switchTab(tab) {
      ['list', 'add', 'scan'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).className = 'w-1/3 py-2 text-center font-bold bg-gray-100 text-gray-700';
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).className = 'w-1/3 py-2 text-center font-bold bg-blue-500 text-white';

      if (tab === 'scan') startCamera(); else stopCamera();
      if (tab === 'list') loadItems();
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 300;
          let w = img.width, h = img.height;
          if (w > h && w > max) { h *= max / w; w = max; }
          else if (h > max) { w *= max / h; h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentPhoto = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('photo-preview').src = currentPhoto;
          document.getElementById('photo-preview').classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveItem() {
      const name = document.getElementById('item-name').value.trim();
      if (!name) return alert('請輸入物品名稱');
      const id = 'ITEM-' + Date.now().toString().slice(-6);

      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "addItem", id, name, photo: currentPhoto })
      });

      alert('新增成功！');
      document.getElementById('item-name').value = '';
      document.getElementById('photo-preview').classList.add('hidden');
      showQR(id, name);
    }

    async function loadItems() {
      const container = document.getElementById('items-list');
      container.innerHTML = '載入中...';
      try {
        const res = await fetch(`${GAS_URL}?action=getItems`);
        const items = await res.json();
        if (items.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">目前無物品，請點擊「拍照新增」</div>';
          return;
        }
        container.innerHTML = items.map(item => `
          <div class="bg-white p-3 rounded-lg shadow-sm flex items-center justify-between border">
            <div class="flex items-center gap-3">
              <img src="${item.Photo || 'https://via.placeholder.com/60'}" class="w-12 h-12 object-cover rounded">
              <div>
                <div class="font-bold text-sm text-gray-800">${item.Name}</div>
                <div class="text-xs text-gray-500">
                  <span class="px-1.5 py-0.5 rounded ${item.Status==='已借出'?'bg-red-100 text-red-600':'bg-green-100 text-green-600'}">${item.Status}</span>
                  ${item.Borrower ? `<span class="ml-1">(${item.Borrower})</span>` : ''}
                </div>
              </div>
            </div>
            <button onclick="showQR('${item.ID}', '${item.Name}')" class="bg-blue-50 text-blue-600 px-2 py-1 text-xs rounded border border-blue-200">QR Code</button>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '載入失敗，請檢查 URL 設定。';
      }
    }

    function showQR(id, name) {
      document.getElementById('modal-title').innerText = name;
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), { text: id, width: 160, height: 160 });
      document.getElementById('qr-modal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('qr-modal').classList.add('hidden'); }

    function startCamera() {
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
        html5QrcodeScanner.render((decodedText) => {
          document.getElementById('target-id').innerText = decodedText;
          document.getElementById('scan-result').classList.remove('hidden');
        });
      }
    }
    function stopCamera() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
        html5QrcodeScanner = null;
      }
    }

    async function doBorrow() {
      const id = document.getElementById('target-id').innerText;
      const borrower = document.getElementById('borrower-input').value.trim();
      if (!borrower) return alert('請輸入借用者姓名');

      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "borrowItem", id, borrower })
      });
      alert('登記借出成功！');
      document.getElementById('borrower-input').value = '';
      switchTab('list');
    }

    async function doReturn() {
      const id = document.getElementById('target-id').innerText;
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "returnItem", id })
      });
      alert('歸還成功！');
      switchTab('list');
    }

    loadItems();
  </script>
</body>
</html>
